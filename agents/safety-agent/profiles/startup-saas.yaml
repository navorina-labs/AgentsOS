# Профиль: SaaS без долгого архива (короткий x, быстрая миграция)
id: startup-saas
name: SaaS / Short Retention
description: Облачный SaaS, ephemeral/session data — фокус на TLS и operational security

organization_defaults:
  migration_years: 1
  quantum_horizon_years: 12

adversary:
  classical: true
  quantum_record: true
  ai_implementation: true

defaults:
  confidentiality_years: 3

apply_ai_governance_template: true

starter_flows:
  - id: saas-api-edge
    name: SaaS API edge TLS
    storage: ephemeral
    hndl_exposed: false
    crypto:
      key_exchange: [ECDHE-P256]
      signatures: []
      symmetric: [AES-256-GCM]
      hash: [SHA-256]
    tags: [saas, api, edge, todo-review]
  - id: tenant-secrets
    name: Tenant secrets / session store
    storage: short
    hndl_exposed: false
    crypto:
      key_exchange: []
      signatures: []
      symmetric: [AES-256-GCM]
      hash: [SHA-256]
    tags: [tenant, secrets, todo-review]

recommended_policies:
  - id: saas-hybrid-tls
    when:
      retention_tier: ephemeral
      has_algorithm: ECDHE-P256
    action: recommend
    recommend:
      key_exchange: ML-KEM-768
      hybrid_with: X25519
