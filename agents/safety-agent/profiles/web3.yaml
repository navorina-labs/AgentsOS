# Профиль: Web3 / on-chain + wallet flows
id: web3
name: Web3 & Digital Assets
description: Кошельки, подписи транзакций, RPC — длинный срок ключей, HNDL, строгий IFF

organization_defaults:
  migration_years: 3
  quantum_horizon_years: 10

adversary:
  classical: true
  quantum_record: true
  ai_implementation: true

defaults:
  confidentiality_years: 20

apply_ai_governance_template: true

starter_flows:
  - id: wallet-keys
    name: Wallet / signing keys
    confidentiality_years: 20
    storage: permanent
    hndl_exposed: true
    crypto:
      key_exchange: [X25519]
      signatures: [Ed25519]
      symmetric: []
      hash: [SHA-256]
    tags: [wallet, web3, todo-review]
  - id: rpc-tls
    name: RPC / indexer TLS
    storage: ephemeral
    hndl_exposed: true
    crypto:
      key_exchange: [ECDHE-P256]
      signatures: []
      symmetric: [AES-256-GCM]
      hash: [SHA-256]
    tags: [rpc, tls, web3, todo-review]

recommended_policies:
  - id: web3-no-rsa-permanent
    when:
      retention_tier: permanent
      has_algorithm: RSA-2048
    action: block
    recommend:
      key_exchange: ML-KEM-1024
      hybrid_with: X25519
  - id: web3-no-weak-hash
    when:
      retention_tier: long
      has_algorithm: MD5
    action: block
  - id: web3-pqc-long-storage
    when:
      retention_tier: long
    action: recommend
    recommend:
      key_exchange: ML-KEM-768
      hybrid_with: X25519
  - id: web3-warn-ecdsa-archive
    when:
      retention_tier: permanent
      has_algorithm: ECDSA-P256
    action: warn
    recommend:
      key_exchange: ML-DSA-65
