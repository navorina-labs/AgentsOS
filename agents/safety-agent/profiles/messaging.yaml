# Профиль: E2EE messaging (чаты, мессенджеры, Signal-подобные протоколы)
id: messaging
name: E2EE Messaging
description: E2EE, double ratchet, долгоживущие identity keys, HNDL на архивах сообщений

organization_defaults:
  migration_years: 3
  quantum_horizon_years: 10

adversary:
  classical: true
  quantum_record: true
  ai_implementation: true

defaults:
  confidentiality_years: 25

apply_ai_governance_template: true

starter_flows:
  - id: e2ee-session
    name: E2EE session (double ratchet)
    storage: ephemeral
    hndl_exposed: true
    crypto:
      key_exchange: [X25519]
      signatures: []
      symmetric: [AES-256-GCM, ChaCha20-Poly1305]
      hash: [SHA-256]
    tags: [e2ee, messaging, todo-review]
  - id: identity-keys
    name: Identity / prekeys
    confidentiality_years: 25
    storage: permanent
    hndl_exposed: true
    crypto:
      key_exchange: [X25519]
      signatures: [Ed25519]
      symmetric: []
      hash: [SHA-256]
    tags: [identity, messaging, todo-review]

recommended_policies:
  - id: msg-no-rsa-identity
    when:
      retention_tier: permanent
      has_algorithm: RSA-2048
    action: block
    recommend:
      key_exchange: ML-KEM-1024
      hybrid_with: X25519
  - id: msg-no-weak-hash
    when:
      retention_tier: long
      has_algorithm: MD5
    action: block
  - id: msg-prefer-aead-ephemeral
    when:
      retention_tier: ephemeral
    action: recommend
    recommend:
      key_exchange: ML-KEM-768
      hybrid_with: X25519
  - id: msg-warn-ecdsa-archive
    when:
      retention_tier: permanent
      has_algorithm: ECDSA-P256
    action: warn
    recommend:
      key_exchange: ML-DSA-65
