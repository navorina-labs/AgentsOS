name: Marketing & SEO Agent / Verify

on:
  push:
    branches: [main]
    paths:
      - "agents/marketing-agent/**"
      - ".github/workflows/marketing-agent.yml"
  pull_request:
    paths:
      - "agents/marketing-agent/**"
      - ".github/workflows/marketing-agent.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: agents/marketing-agent

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_agent.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/audit_page.py tests/fixtures/healthy.html --format json
